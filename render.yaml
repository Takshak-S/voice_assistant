services:
  # Backend API Service
  - type: web
    name: voice-assistant-backend
    runtime: docker
    repo: https://github.com/your-org/realtime_voice_assistant
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.1-70b-versatile
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://voice-assistant-frontend.onrender.com"]'
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"

  # Frontend Service
  - type: web
    name: voice-assistant-frontend
    runtime: node
    repo: https://github.com/your-org/realtime_voice_assistant
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://voice-assistant-backend.onrender.com

databases:
  - name: voice-assistant-db
    databaseName: voice_assistant
    user: postgres
    plan: free
    region: oregon